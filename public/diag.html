<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Измеритель полосы над шапкой</title>
<!--
  Служебная страница для задачи F1_P80. Не часть сайта: ни в меню, ни в карте
  сайта её нет, ссылок на неё тоже. Открывается вручную по адресу /diag.html,
  чтобы посмотреть, как встроенный браузер (телеграм) показывает липкую шапку.
  Удалить, когда задача закроется.
-->
<style>
  :root { --bg: #0a0a0b; --fg: #f2f2f2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.35 ui-monospace, Menlo, monospace; }

  /* Шапка — та же, что на сайте: липкая, полупрозрачная, с размытием. */
  .header {
    position: sticky; top: 0; z-index: 20;
    height: 102px; padding: 8px 12px;
    background: rgba(10, 10, 11, 0.78);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid #333;
  }

  /* Три способа закрасить полосу над шапкой — тремя третями по ширине,
     чтобы одним скриншотом было видно, какой из них работает.

     СПОСОБ 1 (красный, слева) — то, что уже пробовали: подложка продолжена
     вверх псевдоэлементом ВНУТРИ размытой шапки. */
  .header::before {
    content: ''; position: absolute; left: 0; right: 66.67%; bottom: 100%;
    height: 400px; background: #d21f1f;
  }

  /* СПОСОБ 2 (фиолетовый, в середине) — то же самое, но снаружи размытия:
     свой липкий слой нулевой высоты, от него полоса вверх. Если работает
     он, а красный нет, значит виновато размытие шапки. */
  .cover2 { position: sticky; top: 0; height: 0; z-index: 25; }
  .cover2::before {
    content: ''; position: absolute; left: 33.33%; right: 33.33%; bottom: 0;
    height: 400px; background: #9b2fd6;
  }

  /* СПОСОБ 3 (зелёный, справа) — слой, привязанный к окну, а не к странице,
     поднятый выше его верхнего края. Показывает заодно, что браузер считает
     верхом окна. */
  .cover3 {
    position: fixed; top: -400px; left: 66.67%; right: 0;
    height: 400px; background: #1f9d3a; z-index: 30;
  }

  .row { display: flex; justify-content: space-between; }
  .row b { font-weight: 700; }
  .stripe { padding: 22px 12px; font-size: 20px; font-weight: 700; }
  .stripe:nth-child(odd) { background: #f0c020; color: #000; }
  .stripe:nth-child(even) { background: #2060f0; color: #fff; }
</style>

<div class="cover3"></div>

<header class="header">
  <div class="row"><span>шапка сверху</span><b id="h">—</b></div>
  <div class="row"><span>прокрутка</span><b id="s">—</b></div>
  <div class="row"><span>окно / видимое</span><b id="v">—</b></div>
  <div class="row"><span>вырез сверху</span><b id="e">—</b></div>
</header>
<div class="cover2"></div>

<p style="padding: 12px">
  Служебная страница, не часть сайта. Пролистайте вниз и сделайте скриншот так,
  чтобы в кадр попала полоса телеграма с адресом.
</p>

<script>
  const header = document.querySelector('.header');
  const px = (n) => Math.round(n) + 'px';
  function measure() {
    document.getElementById('h').textContent = px(header.getBoundingClientRect().top);
    document.getElementById('s').textContent = px(window.scrollY);
    const vv = window.visualViewport;
    document.getElementById('v').textContent =
      px(window.innerHeight) + ' / ' + (vv ? px(vv.height) + ' @' + px(vv.offsetTop) : 'нет');
    document.getElementById('e').textContent =
      getComputedStyle(document.documentElement).getPropertyValue('--safe-top') || '—';
  }
  // Значение выреза сверху берётся у самого браузера через env().
  document.documentElement.style.setProperty('--safe-top', 'env(safe-area-inset-top, 0px)');
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);width:1px';
  document.body.append(probe);
  const safe = () => px(probe.getBoundingClientRect().height);

  for (let i = 1; i <= 40; i++) {
    const d = document.createElement('div');
    d.className = 'stripe';
    d.textContent = 'полоса ' + i;
    document.body.append(d);
  }

  function tick() {
    measure();
    document.getElementById('e').textContent = safe();
  }
  addEventListener('scroll', tick, { passive: true });
  addEventListener('resize', tick);
  tick();
</script>
